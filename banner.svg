<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Maaz, full-stack developer</title>
  <desc id="d">Dark banner with the name Maaz, the title Full-stack developer, and a status pill reading Open to remote roles.</desc>
  <defs>
    <radialGradient id="glow" cx="12%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#ffb454" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="100%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#6d7dff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#6d7dff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="16" fill="#0c1022"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="16" fill="url(#glow)"/>
  <rect width="1200" height="320" rx="16" fill="url(#cool)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="15.5" fill="none" stroke="#252c4d"/>

  <text x="80" y="90" class="mono" font-size="20" fill="#7c86b8"><tspan fill="#ffb454">$</tspan> whoami</text>

  <text x="76" y="174" class="sans" font-size="84" font-weight="700" letter-spacing="-3" fill="#eef0ff">Maaz</text>

  <text x="80" y="218" class="sans" font-size="26" fill="#a3acd9">Full-stack developer. Next.js and TypeScript.</text>

  <rect x="80" y="246" width="252" height="38" rx="19" fill="#ffb454" fill-opacity="0.08" stroke="#ffb454" stroke-opacity="0.4"/>
  <circle class="pulse" cx="102" cy="265" r="5" fill="#ffb454"/>
  <text x="120" y="270.5" class="mono" font-size="16" fill="#ffc77d">Open to remote roles</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
